      if (stt === "working" && dark > 0.3 && q >= 1) { var hg = g.createLinearGradient(x, 0, x + d * s * 5, 0); hg.addColorStop(0, C(LAMP, 0.4 * dark)); hg.addColorStop(1, C(LAMP, 0)); g.fillStyle = hg; g.beginPath(); g.moveTo(x + d * s, y - s * 0.7); g.lineTo(x + d * s * 5, y - s * 1.1); g.lineTo(x + d * s * 5, y + s * 0.3); g.closePath(); g.fill(); }
      g.save(); g.translate(x, y + bump); if (stt === "failed") g.rotate(-0.22 * d);
      g.fillStyle = C(lit([52, 48, 50]), 1); for (var wv = -1; wv <= 1; wv++) { g.beginPath(); g.arc(wv * s * 0.82, 0, s * 0.32, 0, 6.2832); g.fill(); }
      g.fillStyle = C(lit(HULL, 0.95), 1); g.fillRect(-s, -s * 0.95, s * 2, s * 0.55);
      g.fillStyle = C(lit(HULL, 0.7), 1); g.fillRect(-s, -s * 0.55, s * 2, s * 0.15);
      g.fillStyle = C(lit(PANEL, 1.1), 1); g.beginPath(); g.moveTo(-s * 1.05, -s * 1.02); g.lineTo(s * 0.6, -s * 1.02); g.lineTo(s * 0.75, -s * 1.2); g.lineTo(-s * 0.9, -s * 1.2); g.closePath(); g.fill();
      g.strokeStyle = C(lit(STEEL), 1); g.lineWidth = Math.max(1, s * 0.12); g.beginPath(); g.moveTo(d * s * 0.75, -s * 0.95); g.lineTo(d * s * 0.75, -s * 1.95); g.stroke();
      g.fillStyle = C(lit(HULL), 1); g.fillRect(d * s * 0.75 - s * 0.22, -s * 2.15, s * 0.44, s * 0.26);
      var blink = stt === "waiting" && !still ? 0.5 + 0.5 * Math.sin(tt * 6) : 1;
      g.fillStyle = C(col, blink); g.fillRect(d * s * 0.75 + d * s * 0.1 - s * 0.08, -s * 2.1, s * 0.16, s * 0.16);
      g.restore();
      glow(x + d * s * 0.8, y - s * 2.02, s * (stt === "waiting" ? 2.6 : 1.6), col, (0.35 + 0.45 * dark) * blink * quiet);
      if (stt === "failed" && q >= 1 && !still) for (var sm = 0; sm < 3; sm++) { var sa = ((tt * 0.4 + sm / 3) % 1); g.fillStyle = C(lit([70, 64, 64]), 0.3 * (1 - sa)); g.beginPath(); g.arc(x + Math.sin(sa * 5 + sm) * s * 0.3, y - s * 1.2 - sa * s * 2.6, s * (0.25 + sa * 0.5), 0, 6.2832); g.fill(); }
      if (stt === "waiting") { g.fillStyle = C(WARN, 1); g.font = "700 " + Math.round(H * 0.017) + "px " + FONT; g.textAlign = "center"; g.fillText("!", x + d * s * 0.8, y - s * 2.7); }
      if (stt === "done") { g.strokeStyle = C(OK, 0.95); g.lineWidth = Math.max(1.5, s * 0.16); g.beginPath(); g.moveTo(x + d * s * 0.8 - s * 0.4, y - s * 2.75); g.lineTo(x + d * s * 0.8 - s * 0.1, y - s * 2.5); g.lineTo(x + d * s * 0.8 + s * 0.45, y - s * 3.05); g.stroke(); }
      if (ag.name && q >= 1) { g.fillStyle = C(INK, 0.8 * quiet); g.font = Math.round(H * 0.0105) + "px " + FONT; g.textAlign = "center"; g.fillText(String(ag.name).slice(0, 16), x, y + s * 0.3 + H * 0.014); }
      self.hit.push([x, y - s, s * 2.4, (ag.name || "a rover") + " · " + stt + (ag.text ? " · " + String(ag.text).slice(0, 40) : "")]);
    });

    // ---- your weather, as Mars would have it: rain is a dust storm, snow is frost falling
    var code = wx.code || 0, snow = (code >= 71 && code <= 77) || code === 85 || code === 86;
    var storm = snow ? 0 : Math.max(cl((wx.rain || 0) / 4) * 0.8 + (wx.rain > 0 ? 0.2 : 0), code >= 95 ? 1 : 0, cl((wind - 45) / 60));
    if (storm > 0.02) {
      g.fillStyle = C(M(lit(SAND), hor, 0.5), 0.34 * storm); g.fillRect(0, 0, W, H);
      var nst = still ? 0 : Math.round([0, 60, 130, 240][q] * storm);
      g.strokeStyle = C(M(lit(SAND, 1.15), [255, 255, 255], 0.2), 0.3); g.lineWidth = Math.max(1, u * 1.2); g.beginPath();
      for (i = 0; i < nst; i++) { var dd = this.dust[i], dxx = ((dd[0] + tt * (0.25 + 0.3 * dd[2])) % 1.1 - 0.05) * W, dyy = (dd[1] * 0.9 + 0.08 + Math.sin(tt * 0.7 + dd[3] * 6) * 0.01) * H, len = H * 0.03 * dd[2]; g.moveTo(dxx, dyy); g.lineTo(dxx + len, dyy + len * 0.08); }
      g.stroke();
    }
    if (snow && !still) {
      var nf = [20, 60, 120, 200][q]; g.fillStyle = C([235, 240, 250], 0.75);
      for (i = 0; i < nf; i++) { var f2 = this.dust[i], z2 = Math.max(1, u * (1 + f2[2] * 1.4)); g.fillRect(((f2[0] + Math.sin(tt * 0.4 + f2[3] * 6) * 0.01) % 1) * W, ((f2[1] + tt * 0.03 * f2[2]) % 1) * H, z2, z2); }
    }

    // ---- what it is: one line under the dome
    g.textAlign = "center"; g.font = Math.round(H * 0.0125) + "px " + FONT; g.fillStyle = C(INK, 0.78 * quiet);
    g.fillText(Math.round(cpu) + "% · " + Math.round(temp) + "° · " + cores.length + " cores" + (agents.length ? " · " + agents.length + " rovers" : "") + (rows.length ? " · " + (rows.length + more) + " pods" : "") + (storm > 0.3 ? " · dust storm" : ""), cx, y0 + wallH + H * 0.026);
    g.textAlign = "start";

    // ---- look after itself: the frame time chooses how rich to draw (an old laptop: light; a fast PC in 4K: ultra)
    this.cost.push(performance.now() - t0); if (this.cost.length > 90) this.cost.shift();
    if (this.cost.length === 90 && t - this.qAt > 6) {
      var avg = this.cost.reduce(function (a2, b2) { return a2 + b2; }, 0) / 90, half = st.ui && st.ui.quality === "half", maxQ = half ? 1 : 3;
      if (avg > 7 && q > 0) { this.q = q - 1; this.qAt = t; this.cost = []; }
      else if (avg < 2.2 && q < maxQ) { this.q = q + 1; this.qAt = t + 20; this.cost = []; }   // up slowly, down at once
      else if (q > maxQ) { this.q = maxQ; this.cost = []; }
    }
  },

  click: function (x, y) {
    for (var i = this.hit.length - 1; i >= 0; i--) { var h = this.hit[i]; if (Math.abs(x - h[0]) <= h[2] && Math.abs(y - h[1]) <= h[2]) return h[3]; }
    return "";
  }
});
</script>
