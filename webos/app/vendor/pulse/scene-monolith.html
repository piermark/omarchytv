      var x = cx + side * (W * 0.07 + col2 * H * 0.03), y = hz + H * 0.078 + row2 * H * 0.034 + Math.sin(tt * 0.9 + i) * H * 0.003, s = H * 0.011;

      g.fillStyle = C(M(bg, col, 0.55), 0.95 * bl); g.fillRect(x - s, y - s, s * 2, s * 2);
      g.fillStyle = C(M(bg, col, 0.85), 0.95 * bl); g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x - s * 0.4, y - s * 1.6); g.lineTo(x + s * 1.6, y - s * 1.6); g.lineTo(x + s, y - s); g.closePath(); g.fill();
      g.fillStyle = C(M(bg, col, 0.30), 0.95 * bl); g.beginPath(); g.moveTo(x + s, y - s); g.lineTo(x + s * 1.6, y - s * 1.6); g.lineTo(x + s * 1.6, y + s * 0.4); g.lineTo(x + s, y + s); g.closePath(); g.fill();
      if (q >= 1) glow(x, y + s * 2.2, s * 2.2, col, 0.25 * bl);
      self.hit.push([x, y, s * 2, (o.r.name || o.id) + " · " + (lv || "no state")]);
    });

    // ---- the lake moves with the network; rain is Pulse's, the rings are ours
    var net = Math.min(1, ((sys.rx || 0) + (sys.tx || 0)) / 4e6);
    if (!still && q >= 1 && Math.random() < 0.02 + net * 0.25) this.rip.push([cx + (Math.random() - 0.5) * W * 0.4, hz + Math.pow(Math.random(), 1.6) * (H - hz) * 0.8, t, 0.4 + net]);
    this.rip = this.rip.filter(function (r) {
      var age = t - r[2]; if (age > 2.5) return false;
      var d = (r[1] - hz) / (H - hz), rr = age * H * 0.05 * r[3] * (0.3 + d);
      g.strokeStyle = C(ac, 0.28 * (1 - age / 2.5)); g.lineWidth = Math.max(1, u); g.beginPath(); g.ellipse(r[0], r[1], rr, rr * 0.22, 0, 0, 6.2832); g.stroke(); return true;
    });

    // ---- the rings: memory and disk, turning; behind the monolith first, in front after
    var ring = function (frac, rx, col, spd, part) {
      var ry = rx * 0.2, a0 = tt * spd, y = mid + bob * 0.5;
      g.lineWidth = Math.max(1.5, u * 2.4);
      g.strokeStyle = C(col, 0.18); g.beginPath(); g.ellipse(cx, y, rx, ry, 0, part ? 0 : Math.PI, part ? Math.PI : 6.2832); g.stroke();
      var a1 = a0 + frac * 6.2832;   // the lit arc, cut into the half we draw now
      g.strokeStyle = C(col, 0.95);
      for (var s = 0; s < 24; s++) { var p0 = a0 + (a1 - a0) * s / 24, p1 = a0 + (a1 - a0) * (s + 1) / 24, front = Math.sin((p0 + p1) / 2) > 0; if (front === part) { g.beginPath(); g.ellipse(cx, y, rx, ry, 0, p0, p1); g.stroke(); } }
    };
    var ram = (sys.ram || 0) / 100, disk = (sys.disk || 0) / 100;
    ring(ram, mw * 1.25, a2, 0.25, false); ring(disk, mw * 1.7, ac, -0.16, false);

    // ---- the shards behind it, the monolith, the shards in front
    var agents = (st.agents || []).slice(0, 12), shards = [];
    agents.forEach(function (ag, i) {
      var key = ag.name || "#" + i, o = self.orb[key] || (self.orb[key] = { a: i * 2.1, r: 1 });
      var spd = { working: 0.9, waiting: 0.12, done: 0.3, failed: 0, idle: 0.18 }[ag.state] || 0.2;
      if (!still) o.a += spd * 0.012;
      var wantR = ag.state === "waiting" ? 1.5 : ag.state === "failed" ? 1.25 : 1; o.r += (wantR - o.r) * 0.03;
      var rx = mw * (2.3 + (i % 3) * 0.45) * o.r, ry = rx * 0.24, z = Math.sin(o.a), x = cx + Math.cos(o.a) * rx;
      var y = ag.state === "failed" ? hz + H * 0.02 + (i % 3) * H * 0.01 : mid + z * ry + Math.sin(tt * 1.3 + i) * H * 0.004;
      shards.push({ ag: ag, x: x, y: y, z: ag.state === "failed" ? 1 : z, i: i, a: o.a, rx: rx });
    });
    var shard = function (s) {
      var ag = s.ag, col = { working: ac, waiting: warn, done: ok, failed: crit }[ag.state] || M(fg, bg, 0.45);
      var sz = H * 0.012 * (0.8 + 0.35 * (s.z + 1) / 2) * (ag.state === "waiting" ? 1.5 + (still ? 0 : 0.25 * Math.sin(tt * 5)) : 1), dim = (0.55 + 0.45 * (s.z + 1) / 2) * quiet;
      if (q >= 2 && ag.state === "working" && !still) {   // a trail along its orbit
        g.strokeStyle = C(col, 0.35 * dim); g.lineWidth = Math.max(1, u * 1.5); g.beginPath(); g.ellipse(cx, mid, s.rx, s.rx * 0.24, 0, s.a - 0.5, s.a); g.stroke();
      }
      glow(s.x, s.y, sz * 3, col, 0.5 * dim);
      g.save(); g.translate(s.x, s.y); if (ag.state === "failed") g.rotate(0.9);
      g.fillStyle = C(M(bg, col, 0.9), dim); g.beginPath(); g.moveTo(0, -sz * 1.6); g.lineTo(sz * 0.8, 0); g.lineTo(0, sz * 1.6); g.closePath(); g.fill();
      g.fillStyle = C(M(bg, col, 0.55), dim); g.beginPath(); g.moveTo(0, -sz * 1.6); g.lineTo(-sz * 0.8, 0); g.lineTo(0, sz * 1.6); g.closePath(); g.fill();
      g.restore();
      if (ag.state === "waiting") { g.fillStyle = C(warn, 1); g.font = "700 " + Math.round(H * 0.016) + "px " + FONT; g.textAlign = "center"; g.fillText("!", s.x, s.y - sz * 2.2); }
      if (ag.name && q >= 1 && s.z > -0.2) { g.fillStyle = C(fg, 0.6 * dim); g.font = Math.round(H * 0.0105) + "px " + FONT; g.textAlign = "center"; g.fillText(String(ag.name).slice(0, 16), s.x, s.y + sz * 2.4 + H * 0.01); }
      self.hit.push([s.x, s.y, sz * 3, (ag.name || "an agent") + " · " + ag.state + (ag.text ? " · " + String(ag.text).slice(0, 40) : "")]);
    };
    shards.filter(function (s) { return s.z <= 0; }).forEach(shard);
    glow(cx, mid, mh * (0.55 + 0.25 * load), core, (0.16 + 0.3 * load) * (0.7 + 0.3 * nightK));   // its heart's light
    mono(1, false);
    if (q >= 2) glow(cx, mid, mw * 0.9, core, 0.35 * load + (still ? 0 : 0.08 * Math.sin(tt * 2.2)));
    ring(ram, mw * 1.25, a2, 0.25, true); ring(disk, mw * 1.7, ac, -0.16, true);
    shards.filter(function (s) { return s.z > 0; }).forEach(shard);

    // ---- a focus session: a shield closes around it as the time goes
    if (st.focus && st.focus.until > st.focus.start) {
      var fp = Math.max(0, Math.min(1, (now - st.focus.start) / (st.focus.until - st.focus.start)));
      g.strokeStyle = C(ok, 0.25); g.lineWidth = Math.max(1.5, u * 2); g.beginPath(); g.ellipse(cx, mid, mw * 2.1, mh * 0.62, 0, 0, 6.2832); g.stroke();
      g.strokeStyle = C(ok, 0.95); g.lineWidth = Math.max(2, u * 3.5); g.beginPath(); g.ellipse(cx, mid, mw * 2.1, mh * 0.62, 0, -1.5708, -1.5708 + fp * 6.2832); g.stroke();
    }

    // ---- motes of light rising off the water: more of them, the richer it draws and the busier the machine
    var nd = still ? 0 : [0, 40, 110, 220][q] * (0.35 + 0.65 * load);
    g.fillStyle = C(M(fg, core, 0.5), 0.55);
    for (i = 0; i < nd; i++) {
      var d = this.dust[i], dy = (d[1] + tt * 0.012 * d[2]) % 1, dx = cx + (d[0] - 0.5) * W * 0.5 + Math.sin(tt * 0.3 + d[3]) * H * 0.01, sz2 = Math.max(1, u * (0.8 + d[2] * 1.4));
      g.globalAlpha = Math.sin(dy * 3.1416) * (0.3 + 0.5 * d[2]); g.fillRect(dx, hz + H * 0.02 - dy * H * 0.42, sz2, sz2);
    }
    g.globalAlpha = 1;

    // ---- what it is: one line under it
    g.textAlign = "center"; g.font = Math.round(H * 0.0125) + "px " + FONT; g.fillStyle = C(fg, 0.55 * quiet);
    g.fillText(Math.round(cpu) + "% · " + Math.round(temp) + "° · " + cores.length + " cores" + (agents.length ? " · " + agents.length + " agents" : "") + (rows.length ? " · " + rows.length + " services" : ""), cx, hz + H * 0.034);
    g.textAlign = "start";
    this.hit.push([cx, mid, mh * 0.5, "CPU " + Math.round(cpu) + "% · " + Math.round(temp) + "° · RAM " + Math.round(ram * 100) + "% · disk " + Math.round(disk * 100) + "% · drawing " + ["light", "medium", "high", "ultra"][q]]);

    // ---- look after itself: the frame time chooses how rich to draw (an old laptop: light; a fast PC in 4K: ultra)
    this.cost.push(performance.now() - t0); if (this.cost.length > 90) this.cost.shift();
    if (this.cost.length === 90 && t - this.qAt > 6) {
      var avg = this.cost.reduce(function (a, b) { return a + b; }, 0) / 90, half = st.ui && st.ui.quality === "half", maxQ = half ? 1 : 3;
      if (avg > 7 && q > 0) { this.q = q - 1; this.qAt = t; this.cost = []; }
      else if (avg < 2.2 && q < maxQ) { this.q = q + 1; this.qAt = t + 20; this.cost = []; }   // up slowly, down at once
      else if (q > maxQ) { this.q = maxQ; this.cost = []; }
    }
  },

  click: function (x, y) {
    for (var i = this.hit.length - 1; i >= 0; i--) { var h = this.hit[i]; if (Math.abs(x - h[0]) <= h[2] && Math.abs(y - h[1]) <= h[2]) return h[3]; }
    return "";
  }
});
</script>
